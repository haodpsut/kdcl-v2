<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo Tự đánh giá CSGD</title>
<style>
/* ─── Screen chrome ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Times New Roman', Times, serif; background:#e8e8e8; color:#111; }

.toolbar {
  position:fixed; top:0; left:0; right:0; height:48px; background:#ffffff; border-bottom:1px solid #d9dce1;
  display:flex; align-items:center; gap:10px; padding:0 20px; z-index:100;
}
.toolbar .brand { color:#990000; font-family:'Segoe UI',sans-serif; font-size:13px; font-weight:700; margin-right:auto; }
.tb-btn { padding:7px 16px; border-radius:7px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:'Segoe UI',sans-serif; }
.tb-print { background:#990000; color:#fff; }
.tb-print:hover { opacity:.85; }
.tb-back { background:#eef1f4; color:#1c1e21; }
.tb-back:hover { background:#d9dce1; }
.tb-stat { font-size:12px; color:#606770; font-family:'Segoe UI',sans-serif; }
.tb-opt { font-size:12px; color:#1c1e21; font-family:'Segoe UI',sans-serif; font-weight:600;
          display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 10px;
          border:1px solid #d9dce1; border-radius:7px; background:#f7f8fa; }
.tb-opt input { cursor:pointer; }

/* ─── A4 Pages ──────────────────────────────────────────────────────────────── */
.pages { padding:68px 20px 40px; display:flex; flex-direction:column; align-items:center; gap:20px; }

.page {
  width:210mm; min-height:297mm; background:#fff;
  /* Lề trên màn hình phải KHỚP lề in ở @page. Trước đây màn hình dùng
     20/25/20/30 còn bản in 15/20/15/25, tức bề rộng ruột lệch 10mm, nên chữ
     ngắt dòng khác nhau và phép chia trang đo trên màn hình không đúng với
     giấy: 42 khối đo được lại in ra 65 tờ. */
  padding:15mm 20mm 15mm 25mm;
  box-shadow:0 2px 12px #0003;
  position:relative; page-break-after:always;
}

/* ─── Typography ────────────────────────────────────────────────────────────── */
h1 { font-size:16pt; text-align:center; margin-bottom:6pt; text-transform:uppercase; }
h2 { font-size:13pt; margin:14pt 0 6pt; }
h3 { font-size:12pt; margin:10pt 0 4pt; }
h4 { font-size:11pt; margin:8pt 0 3pt; }
p  { font-size:11pt; line-height:1.6; margin-bottom:6pt; text-align:justify; }
.indent { text-indent:1.2cm; }

/* ─── Cover page ────────────────────────────────────────────────────────────── */
.cover { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:257mm; text-align:center; gap:10pt; }
.cover .ministry   { font-size:11pt; font-weight:bold; text-transform:uppercase; }
.cover .school     { font-size:13pt; font-weight:bold; text-transform:uppercase; margin-bottom:20pt; }
.cover .hr         { width:80%; height:2px; background:#111; margin:8pt auto; }
.cover .report-type{ font-size:11pt; margin-top:20pt; }
.cover .title      { font-size:18pt; font-weight:bold; text-transform:uppercase; line-height:1.4; margin:10pt 0; }
.cover .period     { font-size:12pt; margin-top:10pt; }
.cover .author     { font-size:11pt; }
.cover .date       { font-size:11pt; margin-top:30pt; }

/* ─── TOC ───────────────────────────────────────────────────────────────────── */
.toc-item { font-size:11pt; padding:3pt 0; display:flex; gap:4pt; }
.toc-num  { min-width:1.6cm; font-weight:bold; }
.toc-title{ flex:1; }
.toc-dots { flex:1; border-bottom:1px dotted #888; margin:0 6pt 3pt; min-width:1cm; }
.toc-page { min-width:1cm; text-align:right; }

/* Số trang, đặt ở đáy vùng ruột của từng tờ. */
.so-trang { position:absolute; left:0; right:0; bottom:6mm; text-align:center;
            font-size:10pt; color:#444; }
@media print { .so-trang { bottom:0; } }

/* ─── Section headings ───────────────────────────────────────────────────────── */
.section-part { font-size:13pt; font-weight:bold; text-transform:uppercase; margin:16pt 0 8pt; border-bottom:2px solid #111; padding-bottom:4pt; }
.section-std  { font-size:12pt; font-weight:bold; margin:12pt 0 6pt; background:#f0f4ff; padding:6pt 10pt; border-left:4px solid #2563eb; }
.section-tc   { margin:10pt 0 4pt; }
.tc-header    { font-size:11pt; font-weight:bold; margin-bottom:6pt; }

/* ─── Biểu 04 table ──────────────────────────────────────────────────────────── */
.bieu04 { width:100%; border-collapse:collapse; margin:4pt 0 10pt; font-size:10.5pt; }
.bieu04 th { background:#dbeafe; font-weight:bold; padding:5pt 7pt; border:1px solid #888; vertical-align:top; width:28%; }
.bieu04 td { padding:5pt 7pt; border:1px solid #888; vertical-align:top; line-height:1.5; white-space:pre-wrap; }
.bieu04 .ket-qua { font-weight:bold; font-size:11pt; }
.ket-qua-DAT      { color:#166534; background:#dcfce7; }
.ket-qua-KHONG_DAT{ color:#991b1b; background:#fee2e2; }
.ket-qua-CHUA     { color:#7c2d12; background:#fff7ed; }
.no-data          { font-style:italic; color:#666; font-size:10pt; }

/* ─── Trạng thái minh chứng và phiếu nháp ─────────────────────────────────────
   Bản in nộp cho đoàn đánh giá ngoài phải phân biệt được cái gì đã được duyệt
   với cái gì chưa. Trước đây minh chứng chờ duyệt / bị trả lại và phiếu đánh giá
   còn nháp được in y hệt phần đã duyệt, nên người đọc không có cách nào biết. */
.ev-line { padding:2pt 0; }
.ev-line + .ev-line { border-top:1px dotted #dcdcdc; }
.ev-unverified { background:#fff7ed; border-left:3px solid #b45309; padding-left:5pt; }
.ev-rejected   { background:#fef2f2; border-left:3px solid #991b1b; padding-left:5pt; }
.ev-st  { font-size:8.5pt; font-weight:bold; padding:0 4pt; border-radius:3px; white-space:nowrap; margin-left:4pt; border:1px solid; }
.ev-st.ok   { color:#166534; background:#dcfce7; border-color:#86c99f; }
.ev-st.wait { color:#7c2d12; background:#ffedd5; border-color:#d19a5f; }
.ev-st.rej  { color:#7f1d1d; background:#fee2e2; border-color:#d18f8f; }
.ev-note { font-size:9pt; font-style:italic; color:#7f1d1d; margin-top:1pt; }
.ev-link { font-size:9pt; color:#1d4ed8; word-break:break-all; }
.ev-warn { font-size:9.5pt; font-weight:bold; color:#7c2d12; background:#fff7ed;
           border:1px solid #d19a5f; padding:3pt 5pt; margin-bottom:5pt; }
.draft-flag { font-size:9.5pt; font-weight:bold; color:#7c2d12; background:#fff7ed;
              border:1px dashed #b45309; padding:2pt 6pt; margin-bottom:4pt; display:block; }
.tt-draft { color:#7c2d12; background:#fff7ed; font-weight:bold; }
.tt-appr  { color:#166534; font-weight:bold; }
.badge-draft { background:#fff7ed; color:#7c2d12; border:1px solid #d19a5f;
               padding:0 4pt; border-radius:3px; font-size:8.5pt; font-weight:bold; }
.notice-box { border:2px solid #7c2d12; background:#fff7ed; padding:9pt 13pt; margin:0 0 14pt; }
.notice-box h3 { margin:0 0 6pt; font-size:11.5pt; color:#7c2d12; text-transform:uppercase; }
.notice-box ul { margin:0 0 0 16pt; font-size:10.5pt; line-height:1.6; }
.notice-box .foot { font-size:10pt; font-style:italic; margin-top:6pt; }

/* ─── Evidence list ──────────────────────────────────────────────────────────── */
.ev-table { width:100%; border-collapse:collapse; font-size:10pt; margin:4pt 0 10pt; }
.ev-table th { background:#f1f5f9; font-weight:bold; padding:4pt 6pt; border:1px solid #ccc; text-align:center; }
.ev-table td { padding:3pt 6pt; border:1px solid #ccc; vertical-align:top; }
.ev-table tr:nth-child(even) { background:#f8fafc; }
/* Sọc ngựa vằn có độ ưu tiên cao hơn .ev-unverified nên phải ghi đè đúng bằng
   mức đó, nếu không thì các dòng chẵn mất hẳn dấu hiệu chưa duyệt. */
.ev-table tr.ev-unverified, .ev-table tr.ev-unverified:nth-child(even) { background:#fff7ed; }
.ev-table tr.ev-rejected,   .ev-table tr.ev-rejected:nth-child(even)   { background:#fef2f2; }
.ev-table tr.ev-unverified td:first-child { border-left:3px solid #b45309; }
.ev-table tr.ev-rejected   td:first-child { border-left:3px solid #991b1b; }
/* Ô minh chứng trong Biểu 04 chứa các thẻ div nên phải thoát khỏi pre-wrap của
   .bieu04 td, nếu không mỗi dòng xuống hàng của mã nguồn thành một dòng trống. */
.bieu04 td.ev-cell { white-space:normal; }

/* ─── Summary table ──────────────────────────────────────────────────────────── */
.sum-table { width:100%; border-collapse:collapse; font-size:10.5pt; margin:6pt 0; }
.sum-table th { background:#1e3a5f; color:#fff; padding:5pt 8pt; border:1px solid #888; text-align:center; }
.sum-table td { padding:4pt 8pt; border:1px solid #aaa; vertical-align:middle; }
.sum-table tr:hover { background:#f0f4ff; }
.sum-table .std-row { background:#dbeafe; font-weight:bold; }
.badge-dat  { background:#dcfce7; color:#166534; padding:1pt 5pt; border-radius:3px; font-weight:bold; font-size:9.5pt; }
.badge-kdat { background:#fee2e2; color:#991b1b; padding:1pt 5pt; border-radius:3px; font-weight:bold; font-size:9.5pt; }
.badge-chua { background:#fff7ed; color:#7c2d12; padding:1pt 5pt; border-radius:3px; font-size:9.5pt; }

/* ─── KPI mini table ─────────────────────────────────────────────────────────── */
.kpi-table { width:100%; border-collapse:collapse; font-size:10pt; margin:4pt 0; }
.kpi-table th { background:#f1f5f9; font-weight:bold; padding:4pt 6pt; border:1px solid #ccc; }
.kpi-table td { padding:3pt 6pt; border:1px solid #ccc; }

/* ─── Print media ────────────────────────────────────────────────────────────── */
@media print {
  /* Lề phải đặt ở @page chứ không ở .page. Padding của .page chỉ áp MỘT LẦN cho
     cả khối; khối nào cao hơn một tờ thì từ tờ thứ hai trở đi chữ chạy sát mép,
     đo trên bản PDF thật ra 1,8 mm trên 28 trong 43 trang. Máy in để bàn không
     in được trong khoảng 4 tới 6 mm sát mép nên chỗ đó bị cắt thật khi in ra. */
  @page { size: A4; margin: 15mm 20mm 15mm 25mm; }
  body { background:#fff; }
  .toolbar { display:none !important; }
  .pages { padding:0; gap:0; }
  /* min-height đúng bằng vùng ruột của tờ A4 sau khi trừ lề 15mm trên dưới, để
     dòng số trang nằm ở đáy tờ giấy chứ không dính ngay dưới đoạn văn cuối. */
  .page { width:100%; min-height:267mm; margin:0; padding:0; box-shadow:none;
          page-break-after:always; position:relative; }
  /* Không để bảng hay một tiêu chí bị cắt ngang qua ranh giới trang. */
  .section-tc, .bieu04 tr, .sum-table tr, .ev-table tr { page-break-inside:avoid; }
  .section-std, h1, h2, h3 { page-break-after:avoid; }
  .page:last-child { page-break-after:auto; }
  .section-std { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .bieu04 th   { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .ket-qua-DAT, .ket-qua-KHONG_DAT, .ket-qua-CHUA { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  /* Dấu hiệu "chưa duyệt" mà mất màu khi in thì coi như không có dấu hiệu, nên
     các lớp dưới đây buộc trình duyệt giữ nguyên nền và viền lúc in. */
  .ev-unverified, .ev-rejected, .ev-st, .ev-warn, .draft-flag,
  .tt-draft, .badge-draft, .notice-box, .ev-st-cell {
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
/* Trước đây ở đây là `@page { size:A4; margin:0 }`, đặt SAU khối @media print
   nên nó thắng, và lề của mọi tờ giấy về 0. Lề thật nay đặt trong khối in ở
   trên; giữ lại đây mỗi khổ giấy. */
@page { size:A4; }
</style>
<link rel="stylesheet" href="/theme-school.css">
<script src="/icons.js"></script>
</head>
<body>

<!-- Toolbar (hidden when printing) -->
<div class="toolbar">
  <span class="brand"><span data-ic="report" data-ic-class="k-ic sm"></span> Báo cáo TĐG · Xem trước</span>
  <span class="tb-stat" id="tb-stat">Đang tải...</span>
  <!-- Người soạn được chọn có viện dẫn minh chứng chưa duyệt hay không. Mặc định là CÓ,
       vì bỏ chúng ra khỏi bản in mà không nói gì cũng là một kiểu giấu. Dù chọn cách nào
       thì Phụ lục 2 vẫn liệt kê đủ và số lượng vẫn được ghi rõ. -->
  <label class="tb-opt" id="tb-opt">
    <input type="checkbox" id="cb-unverified" checked onchange="setIncludeUnverified(this.checked)">
    Viện dẫn cả minh chứng chưa duyệt (có đánh dấu)
  </label>
  <button class="tb-btn tb-back" onclick="window.close()"><span data-ic="x" data-ic-class="k-ic sm"></span> Đóng</button>
  <button class="tb-btn tb-print" onclick="window.print()"><span data-ic="print" data-ic-class="k-ic sm"></span> In / Xuất PDF</button>
</div>

<div class="pages" id="pages">
  <div class="page" style="display:flex;align-items:center;justify-content:center">
    <div style="text-align:center;color:#666;font-family:sans-serif">Đang tạo báo cáo...</div>
  </div>
</div>

<script>
const reportId = new URLSearchParams(location.search).get('id');

// Mảng 15 tiêu chuẩn của TT26 từng được gõ cứng ở đây và dùng để dựng mục lục.
// Hậu quả: báo cáo của một chương trình đào tạo có mục lục liệt kê 15 tiêu
// chuẩn cơ sở giáo dục, còn ruột ngay sau đó là 8 tiêu chuẩn TT04. Mục lục và
// ruột mâu thuẫn nhau trong cùng một văn bản đem nộp. Nay mục lục dựng từ
// data.standards, tức đúng bộ của đợt đang mở.

// ── Trạng thái minh chứng và phiếu đánh giá ──────────────────────────────────
// Ba giá trị của evidence.status và hai giá trị của assessments.trang_thai được
// quy về đây, để mọi chỗ in ra dùng chung một cách gọi tên.
const EV_STATUS = {
  da_xac_nhan: { label:'Đã xác nhận', short:'Đã xác nhận', cls:'ok',   ok:true  },
  cho_duyet:   { label:'CHỜ DUYỆT',   short:'Chờ duyệt',   cls:'wait', ok:false },
  tra_lai:     { label:'BỊ TRẢ LẠI',  short:'Bị trả lại',  cls:'rej',  ok:false },
};
function evSt(e) { return EV_STATUS[e && e.status] || { label:'KHÔNG RÕ TRẠNG THÁI', short:'Không rõ', cls:'wait', ok:false }; }
function evOk(e) { return evSt(e).ok; }
function isDraft(a) { return !!a && a.trang_thai !== 'approved'; }

// Đếm minh chứng theo trạng thái. Ô đếm gộp mọi trạng thái làm người đọc tưởng
// cả 57 tài liệu đều đã được duyệt, nên ở đâu in số cũng phải in bản tách.
function evCounts(list) {
  const c = { total:0, da_xac_nhan:0, cho_duyet:0, tra_lai:0, chua:0 };
  for (const e of (list || [])) {
    c.total++;
    if (c[e.status] === undefined) c.cho_duyet++; else c[e.status]++;
    if (!evOk(e)) c.chua++;
  }
  return c;
}

let RPT = null, DATA = null;
// Mặc định CÓ đưa minh chứng chưa duyệt vào bản in, kèm đánh dấu.
let INCLUDE_UNVERIFIED = true;

function setIncludeUnverified(v) {
  INCLUDE_UNVERIFIED = !!v;
  if (RPT && DATA) renderReport(RPT, DATA);
}

(async function init() {
  try {
    const [report, data] = await Promise.all([
      fetch(`/api/reports/${reportId}`).then(r => r.json()),
      fetch('/api/report/data').then(r => r.json()),
    ]);
    // Mở bản in với mã báo cáo sai, hoặc không kèm mã, thì API trả lỗi nhưng
    // trước đây màn vẫn dựng đủ báo cáo với số liệu thật của đợt đang mở, bìa
    // vẫn ghi "Báo cáo Tự đánh giá", không một dòng cảnh báo. Người ta in ra
    // rồi tưởng đó là bản báo cáo đã lưu.
    if (!report || report.error || !report.id) {
      document.getElementById('pages').innerHTML =
        `<div class="page"><h1>Không mở được báo cáo</h1>
         <p class="indent">Không tìm thấy báo cáo${reportId ? ` có mã ${h(String(reportId))}` : ''}
         trong đợt kiểm định đang mở.</p>
         <p class="indent">Hãy mở lại từ trang Báo cáo tự đánh giá và chọn đúng báo cáo, hoặc kiểm
         xem bạn có đang ở đúng đợt kiểm định không.</p></div>`;
      return;
    }
    RPT = report; DATA = data;
    renderReport(report, data);
  } catch(e) {
    document.getElementById('pages').innerHTML =
      '<div class="page"><p style="color:red">Lỗi tải dữ liệu: ' + e.message + '</p></div>';
  }
})();

function renderReport(report, data) {
  const si = data.school_info || {};
  const stats = data.stats || {};
  // Loại đợt quyết định bìa, căn cứ pháp lý và cách gọi tên trong cả văn bản.
  const laCTDT = (data.workspace || {}).type === 'CTDT';
  const tenDot = (data.workspace || {}).name || '';
  const today = new Date().toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });

  // Số phiếu nháp và số minh chứng chưa duyệt, tính một lần rồi dùng lại cho
  // thanh công cụ, hộp ghi chú đầu báo cáo và các phụ lục, để không lệch số.
  const ev = evCounts(data.evidence);
  let phieuTong = 0, phieuNhap = 0, phieuNhapCoKL = 0;
  // Phần II chỉ in ô "Minh chứng liên quan" cho tiêu chí ĐÃ CÓ PHIẾU, nên số minh
  // chứng thực sự được viện dẫn nhỏ hơn tổng kho. Ghi chú đầu báo cáo phải nói
  // đúng con số viện dẫn, không mượn tổng kho cho tiện.
  let vienDan = 0, vienDanChua = 0;
  for (const std of data.standards) for (const c of std.criteriaData) {
    if (!c.assess) continue;
    phieuTong++;
    if (isDraft(c.assess)) {
      phieuNhap++;
      if (c.assess.ket_qua === 'DAT' || c.assess.ket_qua === 'KHONG_DAT') phieuNhapCoKL++;
    }
    for (const e of (c.evidence || [])) { vienDan++; if (!evOk(e)) vienDanChua++; }
  }
  const flags = { ev, phieuTong, phieuNhap, phieuNhapCoKL, vienDan, vienDanChua };

  const TONG_TC = (data.standards || []).reduce((a, x) => a + x.criteria.length, 0) || 60;
  document.getElementById('tb-stat').textContent =
    `${stats.assessed || 0}/${TONG_TC} TC đã đánh giá · ${stats.dat || 0} ĐẠT · ${phieuNhap} phiếu nháp · ` +
    `MC: ${ev.total} (${ev.da_xac_nhan} đã xác nhận, ${ev.cho_duyet} chờ duyệt, ${ev.tra_lai} bị trả lại)`;

  const pages = [];

  // ── Page 1: Cover ───────────────────────────────────────────────────────────
  pages.push(`<div class="page">
    <div class="cover">
      <div class="ministry">BỘ GIÁO DỤC VÀ ĐÀO TẠO</div>
      <div class="school">${h(si.ten_truong || 'Trường Đại học Kiến trúc Đà Nẵng')}</div>
      <div class="hr"></div>
      <div class="report-type">BÁO CÁO</div>
      <div class="title">TỰ ĐÁNH GIÁ<br>${laCTDT ? 'CHƯƠNG TRÌNH ĐÀO TẠO' : 'CƠ SỞ GIÁO DỤC ĐẠI HỌC'}</div>
      ${laCTDT && tenDot ? `<div class="period">Chương trình đào tạo: ${h(tenDot)}</div>` : ''}
      <div class="hr"></div>

  // ── Page 2: TOC ─────────────────────────────────────────────────────────────

  // ── Part II: Assessment by standard ─────────────────────────────────────────

  // Trước đây chỗ này chia trang bằng cách ĐẾM KÝ TỰ HTML, ngưỡng 6000, con số

  if (data.kpi_data && data.kpi_data.length > 0) {
    pages.push(`<div class="page">

  document.getElementById('pages').innerHTML = pages.join('');

// Hộp ghi chú ở đầu báo cáo. Đoàn đánh giá ngoài cầm bản in phải biết ngay từ
// trang đầu là trong hồ sơ còn bao nhiêu phiếu chưa duyệt và bao nhiêu minh
// chứng chưa xác nhận, thay vì phải tự dò từng tiêu chí.
function buildStatusNotice(f) {
  const { ev, phieuTong, phieuNhap, phieuNhapCoKL, vienDan, vienDanChua } = f;
  const phieuLine = phieuNhap
    ? `Có <strong>${phieuTong}</strong> phiếu đánh giá tiêu chí, trong đó <strong>${phieuTong - phieuNhap}</strong> phiếu đã được duyệt và
       <strong>${phieuNhap}</strong> phiếu còn ở trạng thái <strong>NHÁP, chưa được Hội đồng duyệt</strong>${
        phieuNhapCoKL ? ` (trong số phiếu nháp này có <strong>${phieuNhapCoKL}</strong> phiếu đã ghi kết luận Đạt hoặc Không đạt)` : ''}.
       Mỗi tiêu chí có phiếu nháp đều được đánh dấu ngay tại tiêu chí đó ở Phần II và ở Phụ lục 1.`
    : `Toàn bộ <strong>${phieuTong}</strong> phiếu đánh giá tiêu chí đã được duyệt.`;

  const mcLine = ev.chua
    ? `Kho minh chứng có <strong>${ev.total}</strong> tài liệu: <strong>${ev.da_xac_nhan}</strong> đã xác nhận,
       <strong>${ev.cho_duyet}</strong> đang chờ duyệt, <strong>${ev.tra_lai}</strong> bị trả lại.
       Phụ lục 2 liệt kê đủ cả ${ev.total} tài liệu kèm cột trạng thái.`
    : `Toàn bộ <strong>${ev.total}</strong> minh chứng trong hồ sơ đã được xác nhận. Phụ lục 2 liệt kê đủ.`;

  const vdLine = INCLUDE_UNVERIFIED
    ? `Phần II viện dẫn <strong>${vienDan}</strong> minh chứng, trong đó <strong>${vienDanChua}</strong> tài liệu
       <strong>chưa được xác nhận</strong> (đang chờ duyệt hoặc bị trả lại). Các tài liệu này vẫn được giữ trong bản in
       nhưng <strong>đều có đánh dấu trạng thái</strong> ngay tại chỗ viện dẫn, kèm lý do trả lại nếu có.`
    : `Phần II chỉ viện dẫn <strong>${vienDan - vienDanChua}</strong> minh chứng đã xác nhận;
       <strong>${vienDanChua}</strong> minh chứng chưa xác nhận <strong>không được viện dẫn</strong> theo lựa chọn của
       người soạn, nhưng số lượng vẫn được ghi tại từng tiêu chí và chi tiết vẫn có ở Phụ lục 2.`;

  if (!phieuNhap && !ev.chua) {
    return `<div class="notice-box">
      <h3>Ghi chú về tình trạng hồ sơ tại thời điểm in</h3>
      <ul><li>${phieuLine}</li><li>${mcLine}</li></ul>
    </div>`;
  }
  return `<div class="notice-box">
    <h3>Ghi chú về tình trạng hồ sơ tại thời điểm in</h3>
    <ul>
      <li>${phieuLine}</li>
      <li>${mcLine}</li>
      <li>${vdLine}</li>
    </ul>
    <div class="foot">Bản in này phản ánh đúng dữ liệu tại thời điểm kết xuất. Các nội dung chưa được duyệt
      được giữ lại và đánh dấu để đoàn đánh giá thấy rõ, không lược bỏ khỏi hồ sơ.</div>
  </div>`;
}

function buildSchoolInfoBlock(si) {
  if (!si || !Object.keys(si).length) return '<p class="no-data">Chưa nhập thông tin trường (xem Biểu 16, phần Thông tin trường).</p>';
  const rows = [
    ['Tên trường', si.ten_truong], ['Mã trường', si.ma_truong],
    ['Địa chỉ', si.dia_chi], ['Website', si.website],
    ['Điện thoại', si.dien_thoai], ['Email', si.email],
    ['Loại hình', si.loai_hinh], ['Năm thành lập', si.nam_thanh_lap],
  ].filter(([,v]) => v);
  if (!rows.length) return '<p class="no-data">Chưa nhập thông tin trường.</p>';
  return `<table class="kpi-table" style="width:60%">
    ${rows.map(([k,v]) => `<tr><th style="width:40%;text-align:left">${k}</th><td>${h(v)}</td></tr>`).join('')}
  </table>`;
}

// ─── Chia lại trang theo chiều cao thật ───────────────────────────────────────
// Đo sau khi trình duyệt đã vẽ xong, nên biết chính xác chỗ nào tràn. Khối con
// nào vượt quá vùng ruột của tờ giấy thì chuyển sang tờ mới. Không cắt đôi một
// khối con: một bảng Biểu 04 hay một dòng minh chứng phải nằm trọn trên một tờ.
function chiaTrangTheoChieuCao() {
  const host = document.getElementById('pages');
  // Vùng ruột của tờ A4 sau khi trừ lề in 15mm trên dưới, quy về điểm ảnh CSS
  // theo 96 điểm ảnh một inch: (297 - 30) mm = 267 mm ≈ 1009 px. Trừ thêm chỗ
  // cho dòng số trang.
  // Vùng ruột tờ A4 sau khi trừ lề in 15mm trên dưới là 267mm. Chừa thêm 10mm
  // biên an toàn và 26px cho dòng số trang: đo trên màn hình rồi in ra vẫn lệch
  // vài điểm ảnh do làm tròn và do ngắt dòng, thiếu biên là khối tràn sang tờ
  // thứ hai và số trang không còn khớp tờ giấy.
  const CAO = Math.floor((297 - 30 - 10) / 25.4 * 96) - 26;

  // Bảng dài là khối con DUY NHẤT của trang nên vòng chia bên dưới không tách
  // được: Phụ lục 2 là một bảng 184 dòng, tràn qua chín tờ giấy mà vẫn tính là
  // một trang. Cắt bảng theo dòng trước, mỗi mảnh giữ lại hàng tiêu đề.
  for (const bang of [...host.querySelectorAll('.page table')]) {
    const than = bang.querySelector('tbody') || bang;
    const dong = [...than.children].filter((r) => r.tagName === 'TR');
    if (dong.length < 2) continue;   // đủ 2 dòng là cắt được; ngưỡng 12 bỏ sót bảng Biểu 04 dài của một tiêu chí
    if (bang.getBoundingClientRect().height <= CAO) continue;
    const dauBang = bang.querySelector('thead');
    const caoDau = dauBang ? dauBang.getBoundingClientRect().height : 0;
    // Chia theo CHIỀU CAO CỘNG DỒN của từng dòng. Bản trước chia đều số dòng,
    // mà dòng cao thấp khác nhau nên vài mảnh vẫn tràn: đo lại thấy 13 khối
    // còn vượt, toàn là mảnh bảng.
    const suc = CAO - caoDau - 24;
    const nhom = [[]];
    let don = 0;
    for (const r of dong) {
      const h = r.getBoundingClientRect().height;
      if (don + h > suc && nhom[nhom.length - 1].length) { nhom.push([]); don = 0; }
      nhom[nhom.length - 1].push(r);
      don += h;
    }
    let sau = bang;
    for (let k = 1; k < nhom.length; k++) {
      const b2 = document.createElement('table');
      b2.className = bang.className;
      if (dauBang) b2.appendChild(dauBang.cloneNode(true));
      const t2 = document.createElement('tbody');
      for (const r of nhom[k]) t2.appendChild(r);
      b2.appendChild(t2);
      sau.after(b2);
      sau = b2;
    }
  }

  let vong = 0;
  for (;;) {
    const trang = [...host.querySelectorAll('.page')];
    let daTach = false;
    for (const p of trang) {
      if (p.classList.contains('khong-chia')) continue;
      if (p.querySelector('.cover')) continue;   // bìa vốn cao gần trọn tờ, không chia
      const con = [...p.children].filter((c) => !c.classList.contains('so-trang'));
      if (con.length < 2) continue;
      const day = p.getBoundingClientRect().top;
      let cat = -1;
      for (let i = 1; i < con.length; i++) {
        if (con[i].getBoundingClientRect().bottom - day > CAO) { cat = i; break; }
      }
      if (cat < 0) continue;
      const moi = document.createElement('div');
      moi.className = 'page';
      while (p.children.length > cat) moi.appendChild(p.children[cat]);
      p.after(moi);
      daTach = true;
    }
    if (!daTach) break;
    if (++vong > 60) break;   // chặn vòng lặp vô hạn nếu một khối con tự nó cao hơn một tờ
  }
}

// Bản in trước đây không có số trang, mà đây là văn bản mấy chục trang nộp cho
// đoàn đánh giá ngoài. Trình duyệt không cho đếm trang bằng CSS, nhưng sau khi
// đã chia lại theo chiều cao thì mỗi khối .page đúng bằng một tờ giấy, nên đánh
// số ngay trên khối được.
function danhSoTrang() {
  const trang = [...document.querySelectorAll('#pages .page')];
  trang.forEach((p, i) => {
    p.querySelectorAll('.so-trang').forEach((x) => x.remove());
    if (i === 0) return;   // bìa không đánh số
    const d = document.createElement('div');
    d.className = 'so-trang';
    d.textContent = `${i + 1} / ${trang.length}`;
    p.appendChild(d);
  });
}

// Mục lục trước đây có dấu chấm dẫn mà không dẫn tới đâu: lớp .toc-page có
// trong CSS nhưng không phần tử nào được sinh ra. Sau khi chia trang theo chiều
// cao thì mỗi khối .page đúng bằng một tờ giấy, nên tra được số trang thật.
function dienSoTrangMucLuc() {
  const trang = [...document.querySelectorAll('#pages .page')];
  const chuan = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  // Chỉ dò trong các tiêu đề, để không khớp nhầm vào một câu văn có cùng chữ.
  const dau = [];
  trang.forEach((p, i) => {
    p.querySelectorAll('.section-part, .section-std, h1, h2').forEach((e) => {
      dau.push({ chu: chuan(e.textContent), so: i + 1 });
    });
  });
  for (const it of document.querySelectorAll('.toc-item')) {
    const t = chuan(it.dataset.tocTitle);
    if (!t) continue;
    const hit = dau.find((d) => d.chu.includes(t));
    const o = it.querySelector('.toc-page');
    if (o) o.textContent = hit ? String(hit.so) : '';
  }
}

function buildStandardBlock(std) {
  const assessed = std.assessed || 0;
  const total    = std.criteria.length;
  const dat      = std.dat || 0;
  const khong    = std.khong_dat || 0;
  const summary  = `Đã đánh giá ${assessed}/${total} tiêu chí · ${dat} ĐẠT · ${khong} Không ĐẠT`;

  let html = `<div class="section-std">Tiêu chuẩn ${std.id}: ${h(std.name)}<br>
    <small style="font-weight:normal;font-size:10pt">${summary}</small></div>`;

  for (const c of std.criteriaData) {
    const a = c.assess;
    html += `<div class="section-tc">
      <div class="tc-header">Tiêu chí ${c.key}: ${h(c.full || c.name)}${c.dieu_kien ? ' <span style="font-weight:normal;font-size:9.5pt">[tiêu chí điều kiện]</span>' : ''}</div>`;

    if (a) {
      const kqClass = a.ket_qua === 'DAT' ? 'ket-qua-DAT' : a.ket_qua === 'KHONG_DAT' ? 'ket-qua-KHONG_DAT' : 'ket-qua-CHUA';
      const kqLabel = a.ket_qua === 'DAT' ? 'ĐẠT' : a.ket_qua === 'KHONG_DAT' ? 'KHÔNG ĐẠT' : 'Chưa xác định';
      const draft   = isDraft(a);
      // Phiếu nháp có kết luận là ca nguy hiểm nhất: nhìn vào ô "Kết quả đánh giá"
      // thấy ĐẠT y hệt phiếu đã duyệt, nên phải cảnh báo ngay trên đầu tiêu chí.
      const draftFlag = draft
        ? `<span class="draft-flag">PHIẾU ĐÁNH GIÁ CÒN Ở TRẠNG THÁI NHÁP, CHƯA ĐƯỢC HỘI ĐỒNG DUYỆT.${
            (a.ket_qua === 'DAT' || a.ket_qua === 'KHONG_DAT')
              ? ` Kết luận &ldquo;${kqLabel}&rdquo; dưới đây chỉ là kết luận dự thảo.` : ''}</span>`
        : '';
      html += draftFlag;
      html += `<table class="bieu04">
        <tr><th>Hiện trạng</th><td>${h(a.hien_trang || '–')}</td></tr>
        <tr><th>Điểm mạnh</th><td>${h(a.diem_manh || '–')}</td></tr>
        <tr><th>Tồn tại & Hạn chế</th><td>${h(a.ton_tai || '–')}</td></tr>
        <tr><th>Kế hoạch hành động</th><td>${h(a.ke_hoach || '–')}</td></tr>
        <tr><th>Kết quả đánh giá</th><td class="ket-qua ${kqClass}">${kqLabel}</td></tr>
        <tr><th>Trạng thái phiếu</th><td class="${draft ? 'tt-draft' : 'tt-appr'}">${
          draft ? 'NHÁP · chưa được duyệt' : 'Đã duyệt'}</td></tr>
        ${buildEvidenceRow(c.evidence)}
      </table>`;
    } else {
      html += `<p class="no-data">Chưa có dữ liệu đánh giá cho tiêu chí này.</p>`;
    }
    html += '</div>';
  }
  return html;
}

// Ô "Minh chứng liên quan" trong Biểu 04. Mỗi minh chứng in kèm trạng thái; cái
// chưa xác nhận có nền và viền riêng, cái bị trả lại in luôn lý do trả lại, vì
// viện dẫn một minh chứng bị trả lại mà không nói gì là sai lệch hồ sơ.
function buildEvidenceRow(list) {
  const all = list || [];
  if (!all.length) return '';
  const unver = all.filter(e => !evOk(e));
  const shown = INCLUDE_UNVERIFIED ? all : all.filter(evOk);
  const nWait = unver.filter(e => e.status === 'cho_duyet').length;
  const nRej  = unver.filter(e => e.status === 'tra_lai').length;
  const breakdown = [nWait ? `${nWait} chờ duyệt` : '', nRej ? `${nRej} bị trả lại` : ''].filter(Boolean).join(', ');

  let warn = '';
  if (unver.length) {
    warn = INCLUDE_UNVERIFIED
      ? `<div class="ev-warn">Lưu ý: ${unver.length}/${all.length} minh chứng viện dẫn dưới đây CHƯA ĐƯỢC XÁC NHẬN (${breakdown}).</div>`
      : `<div class="ev-warn">Lưu ý: ${unver.length}/${all.length} minh chứng của tiêu chí này chưa được xác nhận (${breakdown})
         nên không được viện dẫn ở đây; xem chi tiết tại Phụ lục 2.</div>`;
  }
  if (!shown.length) {
    return `<tr><th>Minh chứng liên quan</th><td class="ev-cell">${warn}
      <span class="no-data">Không còn minh chứng đã xác nhận nào để viện dẫn cho tiêu chí này.</span></td></tr>`;
  }
  const lines = shown.map(e => {
    const st = evSt(e);
    const cls = st.ok ? '' : (e.status === 'tra_lai' ? ' ev-rejected' : ' ev-unverified');
    const note = (!st.ok && e.status === 'tra_lai' && e.review_note)
      ? `<div class="ev-note">Lý do trả lại: ${h(e.review_note)}</div>` : '';
    return `<div class="ev-line${cls}"><code>${h(e.code)}</code> ${h(e.mo_ta)}
      <span class="ev-st ${st.cls}">${st.label}</span>${note}</div>`;
  }).join('');
  return `<tr><th>Minh chứng liên quan</th><td class="ev-cell">${warn}${lines}</td></tr>`;
}

function buildSummaryParagraph(stats, standards) {
  const assessed = stats.assessed || 0;
  const dat      = stats.dat || 0;
  const khong    = stats.khong_dat || 0;
  // Quy mô theo bộ tiêu chuẩn của đợt: TT26 là 15/60, TT04 là 8/52. Câu tóm tắt
  // này in thẳng vào báo cáo tự đánh giá nộp ra ngoài nên sai số là sai văn bản.
  const soTC     = (standards || []).length || 15;
  const TONG     = (standards || []).reduce((a, x) => a + x.criteria.length, 0) || 60;
  const chua     = TONG - assessed;
  const pct      = Math.round(dat / TONG * 100);
  return `<p class="indent">Qua quá trình tự đánh giá, Hội đồng TĐG đã hoàn thành đánh giá ${assessed}/${TONG} tiêu chí thuộc ${soTC} tiêu chuẩn theo quy định của Thông tư. Trong đó, có <strong>${dat} tiêu chí ĐẠT</strong> (chiếm ${pct}% tổng số), <strong>${khong} tiêu chí Không ĐẠT</strong>${chua > 0 ? `, và ${chua} tiêu chí chưa hoàn thành đánh giá` : ''}.</p>
  <p class="indent">Kết quả tự đánh giá phản ánh những nỗ lực liên tục của nhà trường trong việc nâng cao chất lượng đào tạo, nghiên cứu khoa học và phục vụ cộng đồng. Các tiêu chí chưa đạt yêu cầu đã được nhận diện và đề xuất kế hoạch cải tiến cụ thể.</p>`;
}

function buildSummaryTable(standards) {
  const rows = [];
  let nDraft = 0;
  for (const std of standards) {
    rows.push(`<tr class="std-row">
      <td colspan="3" style="font-weight:bold">TC ${std.id}: ${h(std.name)}</td>
      <td colspan="2" style="text-align:center">${std.dat}/${std.criteria.length} ĐẠT</td>
    </tr>`);
    for (const c of std.criteriaData) {
      const a = c.assess;
      const kq = a ? (a.ket_qua === 'DAT' ? '<span class="badge-dat">ĐẠT</span>' : a.ket_qua === 'KHONG_DAT' ? '<span class="badge-kdat">Không ĐẠT</span>' : '<span class="badge-chua">Chưa XĐ</span>') : '<span class="badge-chua">Chưa ĐG</span>';
      // Cột trạng thái phiếu để bảng tổng hợp không biến phiếu nháp thành kết
      // quả chính thức chỉ vì nó nằm cạnh các dòng đã duyệt.
      const draft = isDraft(a);
      if (a && draft) nDraft++;
      const tt = !a ? '–'
        : draft ? '<span class="badge-draft">NHÁP</span>'
        : '<span class="tt-appr" style="font-size:9.5pt">Đã duyệt</span>';
      rows.push(`<tr>
        <td style="text-align:center">${c.key}</td>
        <td>${h(c.full || c.name)}</td>
        <td>${a ? h(a.nguoi_thuc_hien || '–') : '–'}</td>
        <td style="text-align:center">${kq}</td>
        <td style="text-align:center">${tt}</td>
      </tr>`);
    }
  }
  return `${nDraft ? `<p style="font-size:10.5pt;margin-bottom:6pt"><strong>Lưu ý:</strong> ${nDraft} phiếu trong bảng dưới đây
    còn ở trạng thái NHÁP, chưa được Hội đồng duyệt; kết quả tương ứng chỉ là kết quả dự thảo.</p>` : ''}
  <table class="sum-table">
    <thead><tr>
      <th style="width:8%">Tiêu chí</th>
      <th style="width:41%">Nội dung</th>
      <th style="width:21%">Người thực hiện</th>
      <th style="width:15%">Kết quả</th>
      <th style="width:15%">Trạng thái phiếu</th>
    </tr></thead>
    <tbody>${rows.join('')}</tbody>
  </table>`;
}

function buildEvidenceAppendix(evidence) {
  if (!evidence || !evidence.length)
    return '<p class="no-data">Chưa có minh chứng nào được lưu trữ trong hệ thống.</p>';

  // Group by standard
  const byStd = {};
  for (const e of evidence) {
    const std = e.tieu_chuan || '?';
    if (!byStd[std]) byStd[std] = [];
    byStd[std].push(e);
  }
  const tot = evCounts(evidence);
  let html = `<p style="font-size:10.5pt;margin-bottom:8pt">
    Tổng số <strong>${tot.total}</strong> minh chứng, gồm <strong>${tot.da_xac_nhan}</strong> đã xác nhận,
    <strong>${tot.cho_duyet}</strong> chờ duyệt và <strong>${tot.tra_lai}</strong> bị trả lại.
    ${tot.chua ? `<strong>${tot.chua}</strong> minh chứng chưa được xác nhận vẫn được liệt kê đầy đủ dưới đây, có nền riêng
      và đánh dấu ở cột Trạng thái${INCLUDE_UNVERIFIED ? '' : '; theo lựa chọn của người soạn, các minh chứng này KHÔNG được viện dẫn tại Phần II'}.` : ''}
  </p>`;

  for (const std of Object.keys(byStd).sort((a,b) => Number(a)-Number(b))) {
    const c = evCounts(byStd[std]);
    html += `<h3>Tiêu chuẩn ${std}
      <small style="font-weight:normal;font-size:10pt">(${c.total} minh chứng: ${c.da_xac_nhan} đã xác nhận,
      ${c.cho_duyet} chờ duyệt, ${c.tra_lai} bị trả lại)</small></h3>
    <table class="ev-table">
      <thead><tr>
        <th style="width:13%">Mã MC</th><th style="width:6%">Tiêu chí</th><th style="width:31%">Mô tả</th>
        <th style="width:28%">Tên file / Địa chỉ liên kết</th><th style="width:12%">Trạng thái</th><th style="width:10%">Ngày thêm</th>
      </tr></thead>
      <tbody>
        ${byStd[std].map(e => {
          const st = evSt(e);
          // Minh chứng dạng link không có file_name nên ô này từng bỏ trống hoàn
          // toàn: đoàn cầm phụ lục không có cách nào truy ra tài liệu. In địa chỉ.
          const src = e.source_type === 'link'
            ? (e.link_url ? `<span class="ev-link">${h(e.link_url)}</span>` : '<span class="no-data">Minh chứng dạng liên kết, chưa nhập địa chỉ</span>')
            : (e.file_name ? h(e.file_name) : '<span class="no-data">Chưa có tệp đính kèm</span>');
          const note = (e.status === 'tra_lai' && e.review_note)
            ? `<div class="ev-note">Lý do trả lại: ${h(e.review_note)}</div>` : '';
          const rowCls = st.ok ? '' : (e.status === 'tra_lai' ? ' class="ev-rejected"' : ' class="ev-unverified"');
          return `<tr${rowCls}>
            <td><code>${h(e.code)}</code></td>
            <td style="text-align:center">${h(e.tieu_chi)}</td>
            <td>${h(e.mo_ta || '–')}${note}</td>
            <td>${src}</td>
            <td style="text-align:center" class="ev-st-cell"><span class="ev-st ${st.cls}" style="margin-left:0">${st.label}</span></td>
            <td>${h(e.created_at)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }
  return html;
}

function buildKpiAppendix(kpiData) {
  const sorted = [...kpiData].sort((a,b) => (b.nam_hoc||'').localeCompare(a.nam_hoc||''));
  const fields = [
    ['so_gv_co_huu','GV cơ hữu'], ['pct_gv_ts','% GV có TS (%)'],
    ['so_nguoi_hoc_dh','SV ĐH'], ['pct_tot_nghiep','Tỉ lệ TN (%)'],
    ['pct_viec_lam_12t','VL 12t (%)'], ['so_bao_isi_scopus','Bài ISI/Scopus'],
    ['tong_dien_tich_dat','Diện tích đất (m²)'],
  ];
  return `<table class="kpi-table">
    <thead>
      <tr>
        <th>Chỉ số</th>
        ${sorted.map(r => `<th>${h(r.nam_hoc)}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${fields.map(([key, label]) => `<tr>
        <td><strong>${label}</strong></td>
        ${sorted.map(r => `<td style="text-align:center">${r[key] != null ? h(String(r[key])) : '–'}</td>`).join('')}
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
